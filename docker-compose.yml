# Local development environment for via-farm-lab.
# `docker compose up` brings up Postgres (and sim-bff later when Postgres is wired).
services:
  postgres:
    image: postgres:17-alpine
    container_name: via-farm-lab-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: via_farm_lab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d via_farm_lab']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
